# Proposal only: this path is not .github/workflows and is not auto-executed.
name: Customer security proposal
on:
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  java-security:
    runs-on: ubuntu-latest
    env:
      # Set these after Customer exists; never point at an unrelated project.
      CUSTOMER_SERVICE_DIR: ""
      CUSTOMER_BASE_URL: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require a real Maven Customer project and running test target
        shell: bash
        run: |
          test -n "$CUSTOMER_SERVICE_DIR" && test -f "$CUSTOMER_SERVICE_DIR/pom.xml" || { echo "Configure the real Customer Maven project first"; exit 1; }
          test -n "$CUSTOMER_BASE_URL" || { echo "Configure and start the Customer test target first"; exit 1; }
      - name: OWASP Dependency-Check Maven audit
        shell: bash
        run: |
          cd "$CUSTOMER_SERVICE_DIR"
          mvn -B org.owasp:dependency-check-maven:12.1.8:check -DfailBuildOnCVSS=7
      - name: Negative authorization integration test
        shell: bash
        run: |
          cd "$CUSTOMER_SERVICE_DIR"
          mvn -B -Dtest=CustomerPatchUnauthorizedTest -DfailIfNoTests=true test
